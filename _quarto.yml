project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "work/*.qmd"
    - "notebooks/**/*.qmd"
    - "!DO-NOT-PUBLISH.md"
    - "!README.md"
    # Held until the locked CV PDF supplies real citations and the
    # 2017-2019 employer. Do not re-enable with PENDING text in them.
    - "!papers.qmd"
    - "!cv.qmd"
  resources:
    - files/

website:
  title: "Rishad Ahmed"
  description: "Applied epidemiologist. Observational studies on linked administrative and surveillance data."
  site-url: "https://englishshuvo.github.io"
  open-graph: true
  navbar:
    pinned: true
    left:
      - href: index.qmd
        text: Home
      - text: Work
        menu:
          - href: work/rwe.qmd
            text: "Observational and RWE"
          - href: work/exposure.qmd
            text: "Occupational and environmental"
          - href: work/surveillance.qmd
            text: "Surveillance systems"
          - href: work/outcomes.qmd
            text: "Outcomes and decision evidence"
      - href: methods.qmd
        text: Methods
  page-footer:
    left: "Rishad Ahmed, PhD, MBA. Lincoln, Nebraska."
    right:
      - text: LinkedIn
        href: "https://www.linkedin.com/in/rishad-ahmed-a9398579"
      - text: GitHub
        href: "https://github.com/englishshuvo"

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    toc-depth: 2
    anchor-sections: true
    link-external-newwindow: true
    grid:
      body-width: 900px

execute:
  freeze: auto
